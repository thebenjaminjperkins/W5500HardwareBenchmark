[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino

board_build.core = earlephilhower

monitor_speed = 115200

build_flags =
    -D_WIZCHIP_=W5500
    -Ilib/ioLibrary_Driver/Ethernet
    -Ilib/ioLibrary_Driver/Ethernet/W5500
    -I${platformio.packages_dir}/framework-arduinopico/pico-sdk/lib/mbedtls/include
    -I${platformio.packages_dir}/framework-arduinopico/pico-sdk/lib/mbedtls/library
    -DMBEDTLS_CONFIG_FILE=\"benchmark_config.h\"
    -Ilib/mbedtls-benchmark
    -O3

build_unflags =
    -Os



lib_archive = no
lib_ldf_mode = deep+
lib_deps =
    symlink://lib/mbedtls-benchmark